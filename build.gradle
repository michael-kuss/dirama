plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.9'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.diffplug.spotless' version "8.1.0"
  id 'org.owasp.dependencycheck' version "12.1.8"
  id 'org.cyclonedx.bom' version '2.3.1'
}

apply from: 'corporate/release.gradle'
apply from: 'corporate/security.gradle'
apply from: 'corporate/spotless.gradle'

group = 'de.miq'
version = '0.0.1-SNAPSHOT'
description = 'Digital Radio Manager'

def mapStructVersion = '1.5.5.Final'

java {
  version = 21
}

repositories {
  mavenCentral()
  gradlePluginPortal()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  implementation 'org.springframework.boot:spring-boot-starter-freemarker'
  //implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  //implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

  implementation "org.mapstruct:mapstruct:$mapStructVersion"

  implementation 'com.auth0:java-jwt:4.4.0'

  //implementation 'org.flywaydb:flyway-core'
  //implementation 'org.flywaydb:flyway-database-postgresql'
  compileOnly 'org.projectlombok:lombok'

  annotationProcessor 'org.projectlombok:lombok'
  annotationProcessor "org.mapstruct:mapstruct-processor:$mapStructVersion"

  // CVE HOTFIXES
  implementation 'org.apache.commons:commons-lang3:3.20.0'

  implementation "commons-io:commons-io:2.21.0"
  implementation "commons-net:commons-net:3.12.0"

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  runtimeOnly 'org.postgresql:postgresql'

  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  // testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}

version = getReleaseNumber()

tasks.register('dockerPrepare', Copy) {
  from 'src/docker/dirama'
  into rootProject.layout.buildDirectory.file('docker')
}

tasks.register('dockerProvideJar', Copy) {
  dependsOn bootJar, dockerPrepare
  from rootProject.layout.buildDirectory.file('libs')
  into rootProject.layout.buildDirectory.file('docker')
  include '*.jar'
}

tasks.register('dockerBuild', Exec) {
  dependsOn dockerProvideJar
  workingDir rootProject.layout.buildDirectory.file('docker')
  commandLine 'docker', 'build', '--pull', '-t', rootProject.name + ':latest', '-t', rootProject.name + ':' + getReleaseNumber(), '.'
}
