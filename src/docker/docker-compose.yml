
name: dirama

networks:
  net-dirama:
    ipam:
      driver: default
      config:
        - subnet: '10.0.0.0/24'

volumes:
  vol-db:

services:
  postgres:
    image: postgres:16-alpine
    shm_size: "128m"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - ENABLE_AUTOVACUUM=true
    networks:
      - net-dirama
    volumes:
      - vol-db:/var/lib/postgresql/data:rw
  dirama:
    image: dirama
    ports:
      - "8080:8080"
    environment:
      - POST=123
    networks:
      - net-dirama
