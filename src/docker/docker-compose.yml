
name: dirama

networks:
  net-dirama:
    ipam:
      driver: default
      config:
        - subnet: '10.0.0.0/24'

volumes:
  vol-db:

services:
  postgres:
    image: postgres:16-alpine
    shm_size: "128m"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=dirama-postgres
      - POSTGRES_DB=dirama
      - ENABLE_AUTOVACUUM=true
    networks:
      - net-dirama
    volumes:
      - vol-db:/var/lib/postgresql/data:rw
  dirama:
    image: dirama:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dirama
      - SPRING_DATASOURCE_USERNAME=dirama-postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - net-dirama
